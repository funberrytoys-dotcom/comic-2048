<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>💥 COMIC 2048 — Chico Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: repeating-conic-gradient(#ffeb3b 0% 25%, #ff9800 0% 50%) 0 0 / 60px 60px;
  font-family: 'Comic Neue', cursive;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; overflow:hidden;
}
.comic-border {
  border:6px solid #000;
  border-radius:12px;
  box-shadow: 8px 8px 0 #000;
  background:#fff;
}
.header {
  text-align:center; margin-bottom:15px; padding:15px 30px;
  background: linear-gradient(135deg, #ff6b6b, #ffe66d, #4ecdc4);
  position:relative;
}
.header h1 {
  font-family: 'Bangers', cursive;
  font-size:3.5rem;
  color:#fff;
  text-shadow: 4px 4px 0 #000, -2px -2px 0 #000;
  letter-spacing:3px;
  transform: rotate(-2deg);
}
.header .subtitle {
  font-size:1.2rem; color:#222; font-weight:bold;
  background:#fff; display:inline-block; padding:4px 12px;
  border:3px solid #000; transform:rotate(2deg); margin-top:5px;
  box-shadow:3px 3px 0 #000;
}
.score-box {
  display:flex; gap:15px; margin-bottom:15px;
}
.score-panel {
  padding:10px 25px; text-align:center;
  background: linear-gradient(180deg, #4ecdc4, #44a08d);
  font-family:'Bangers', cursive; font-size:1.3rem; color:#fff;
  text-shadow:2px 2px 0 #000;
}
.score-panel span { display:block; font-size:0.9rem; font-family:'Comic Neue'; }
.btn {
  font-family:'Bangers', cursive; font-size:1.2rem; padding:8px 20px;
  background:#ff6b6b; color:#fff; border:4px solid #000; cursor:pointer;
  box-shadow:4px 4px 0 #000; transition:all 0.1s;
}
.btn:active { transform:translate(2px,2px); box-shadow:2px 2px 0 #000; }
.game-container {
  position:relative; padding:15px; background:#333;
}
.grid-bg {
  display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
  width:340px; height:340px;
}
.cell {
  width:72px; height:72px; border-radius:8px;
  background:#555; border:3px solid #222;
  display:flex; align-items:center; justify-content:center;
  font-family:'Bangers', cursive; font-size:1.6rem;
  color:#fff; text-shadow:2px 2px 0 #000;
  transition:all 0.15s cubic-bezier(0.4,0,0.2,1);
}
.cell[data-val="2"] { background:linear-gradient(135deg,#ff9a9e,#fecfef); color:#000; text-shadow:none; }
.cell[data-val="4"] { background:linear-gradient(135deg,#a18cd1,#fbc2eb); color:#000; text-shadow:none; }
.cell[data-val="8"] { background:linear-gradient(135deg,#84fab0,#8fd3f4); }
.cell[data-val="16"] { background:linear-gradient(135deg,#ffecd2,#fcb69f); color:#000; text-shadow:none; }
.cell[data-val="32"] { background:linear-gradient(135deg,#f6d365,#fda085); color:#000; text-shadow:none; }
.cell[data-val="64"] { background:linear-gradient(135deg,#ff6b6b,#ee5a6f); }
.cell[data-val="128"] { background:linear-gradient(135deg,#667eea,#764ba2); font-size:1.4rem; }
.cell[data-val="256"] { background:linear-gradient(135deg,#11998e,#38ef7d); font-size:1.4rem; }
.cell[data-val="512"] { background:linear-gradient(135deg,#fc4a1a,#f7b733); font-size:1.4rem; }
.cell[data-val="1024"] { background:linear-gradient(135deg,#f12711,#f5af19); font-size:1.2rem; }
.cell[data-val="2048"] { background:linear-gradient(135deg,#00c6ff,#0072ff); font-size:1.2rem; animation:pulse 0.5s infinite alternate; }
.cell[data-val="4096"] { background:linear-gradient(135deg,#8e2de2,#4a00e0); font-size:1.2rem; }
.cell[data-val="8192"] { background:linear-gradient(135deg,#000,#434343); font-size:1.2rem; }

@keyframes pulse { from { transform:scale(1); } to { transform:scale(1.08); } }

.cell.pop { animation:pop 0.2s ease-out; }
@keyframes pop { 0%{transform:scale(0.5);} 70%{transform:scale(1.15);} 100%{transform:scale(1);} }

.cell.merge-boom::after {
  content:"💥"; position:absolute; font-size:2rem;
  animation:boom 0.4s ease-out forwards; pointer-events:none;
}
@keyframes boom { 0%{opacity:1;transform:scale(0.5);} 100%{opacity:0;transform:scale(2);} }

.overlay {
  position:absolute; inset:0; background:rgba(0,0,0,0.85);
  display:none; flex-direction:column; align-items:center; justify-content:center;
  border-radius:12px; z-index:10;
}
.overlay.show { display:flex; }
.overlay h2 {
  font-family:'Bangers',cursive; font-size:3rem; color:#ffe66d;
  text-shadow:4px 4px 0 #ff6b6b, -2px -2px 0 #000;
  margin-bottom:15px; transform:rotate(-3deg);
}
.speech-bubble {
  background:#fff; border:4px solid #000; border-radius:20px;
  padding:15px 25px; position:relative; margin-bottom:20px;
  font-family:'Comic Neue',cursive; font-size:1.2rem; font-weight:bold;
  box-shadow:5px 5px 0 #000;
}
.speech-bubble::after {
  content:''; position:absolute; bottom:-20px; left:50%; transform:translateX(-50%);
  border:10px solid transparent; border-top-color:#000;
}
.controls-hint {
  margin-top:10px; font-size:0.95rem; color:#333; font-weight:bold;
  background:#fff; padding:8px 15px; border:3px solid #000;
  box-shadow:3px 3px 0 #000; transform:rotate(1deg);
}
.mobile-btns {
  display:none; grid-template-columns:repeat(3,1fr); gap:8px;
  margin-top:15px; width:220px;
}
.mobile-btns button {
  font-family:'Bangers',cursive; font-size:1.5rem; padding:12px;
  background:#4ecdc4; border:4px solid #000; box-shadow:3px 3px 0 #000;
  cursor:pointer;
}
.mobile-btns button:active { transform:translate(2px,2px); box-shadow:1px 1px 0 #000; }
.mobile-btns .empty { visibility:hidden; }

@media (max-width:500px) {
  .header h1 { font-size:2.5rem; }
  .grid-bg { width:300px; height:300px; }
  .cell { width:60px; height:60px; font-size:1.3rem; }
  .mobile-btns { display:grid; }
}
</style>
</head>
<body>

<div class="header comic-border">
  <h1>💥 COMIC 2048</h1>
  <div class="subtitle">🎨 Chico & Pupsa Edition</div>
</div>

<div class="score-box">
  <div class="score-panel comic-border"><span>SCORE</span><div id="score">0</div></div>
  <div class="score-panel comic-border"><span>BEST</span><div id="best">0</div></div>
  <button class="btn comic-border" onclick="newGame()">NEW GAME</button>
</div>

<div class="game-container comic-border">
  <div class="grid-bg" id="grid"></div>
  <div class="overlay" id="overlay">
    <h2 id="msg">GAME OVER!</h2>
    <div class="speech-bubble" id="bubble">Попробуй ещё раз, герой!</div>
    <button class="btn comic-border" onclick="newGame()">PLAY AGAIN</button>
  </div>
</div>

<div class="mobile-btns">
  <div class="empty"></div>
  <button onclick="move('up')">⬆️</button>
  <div class="empty"></div>
  <button onclick="move('left')">⬅️</button>
  <button onclick="move('down')">⬇️</button>
  <button onclick="move('right')">➡️</button>
</div>

<div class="controls-hint comic-border">
  🖥️ WASD / Стрелки | 📱 Свайпы / Кнопки ниже
</div>

<script>
let board, score, best=parseInt(localStorage.getItem('comic2048best')||0);
const gridEl=document.getElementById('grid');
const scoreEl=document.getElementById('score');
const bestEl=document.getElementById('best');
const overlay=document.getElementById('overlay');
const msg=document.getElementById('msg');
const bubble=document.getElementById('bubble');

const phrasesWin=[
  "2048! Ты настоящий герой! 🦸",
  "BOOM! Мозг взорвался от крутости! 💥",
  "Чико гордится тобой! 🎉",
  "Пупса аплодирует стоя! 👏"
];
const phrasesLose=[
  "Ой-ой, злодей победил! 😢",
  "Не сдавайся, герой! 🦸",
  "Попробуй ещё раз, Чико верит в тебя! 💪",
  "Даже супергерои падают — и встают! 🚀"
];

function init(){
  board=Array(4).fill().map(()=>Array(4).fill(0));
  score=0; bestEl.textContent=best;
  addRandom(); addRandom(); draw();
}

function addRandom(){
  const empty=[];
  for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!board[r][c])empty.push([r,c]);
  if(!empty.length)return false;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  board[r][c]=Math.random()<0.9?2:4;
  return true;
}

function draw(){
  gridEl.innerHTML='';
  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      const d=document.createElement('div');
      d.className='cell';
      if(board[r][c]){ d.textContent=board[r][c]; d.dataset.val=board[r][c]; }
      gridEl.appendChild(d);
    }
  }
  scoreEl.textContent=score;
  if(score>best){best=score; bestEl.textContent=best; localStorage.setItem('comic2048best',best);}
}

function slideRowLeft(row){
  let arr=row.filter(x=>x);
  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]){ arr[i]*=2; score+=arr[i]; arr[i+1]=0; }
  }
  arr=arr.filter(x=>x);
  while(arr.length<4)arr.push(0);
  return arr;
}

function moveLeft(){ let moved=false; for(let r=0;r<4;r++){ const old=[...board[r]]; board[r]=slideRowLeft(board[r]); if(old.join()!==board[r].join())moved=true; } return moved; }
function moveRight(){ let moved=false; for(let r=0;r<4;r++){ board[r].reverse(); const old=[...board[r]]; board[r]=slideRowLeft(board[r]); if(old.join()!==board[r].join())moved=true; board[r].reverse(); } return moved; }
function moveUp(){ let moved=false; for(let c=0;c<4;c++){ let col=[board[0][c],board[1][c],board[2][c],board[3][c]]; const old=[...col]; col=slideRowLeft(col); if(old.join()!==col.join())moved=true; for(let r=0;r<4;r++)board[r][c]=col[r]; } return moved; }
function moveDown(){ let moved=false; for(let c=0;c<4;c++){ let col=[board[0][c],board[1][c],board[2][c],board[3][c]]; const old=[...col]; col.reverse(); col=slideRowLeft(col); col.reverse(); if(old.join()!==col.join())moved=true; for(let r=0;r<4;r++)board[r][c]=col[r]; } return moved; }

function move(dir){
  let moved=false;
  if(dir==='left')moved=moveLeft();
  else if(dir==='right')moved=moveRight();
  else if(dir==='up')moved=moveUp();
  else if(dir==='down')moved=moveDown();
  if(moved){ addRandom(); draw(); checkStatus(); }
}

function checkStatus(){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(board[r][c]===2048){ showWin(); return; }
  for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!board[r][c])return;
  for(let r=0;r<4;r++)for(let c=0;c<3;c++)if(board[r][c]===board[r][c+1])return;
  for(let c=0;c<4;c++)for(let r=0;r<3;r++)if(board[r][c]===board[r+1][c])return;
  showGameOver();
}

function showWin(){
  msg.textContent="YOU WIN! 🏆"; msg.style.color="#ffe66d";
  bubble.textContent=phrasesWin[Math.floor(Math.random()*phrasesWin.length)];
  overlay.classList.add('show');
}
function showGameOver(){
  msg.textContent="GAME OVER!"; msg.style.color="#ff6b6b";
  bubble.textContent=phrasesLose[Math.floor(Math.random()*phrasesLose.length)];
  overlay.classList.add('show');
}

function newGame(){ overlay.classList.remove('show'); init(); }

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','a','A','ф','Ф'].includes(e.key)){e.preventDefault();move('left');}
  else if(['ArrowRight','d','D','в','В'].includes(e.key)){e.preventDefault();move('right');}
  else if(['ArrowUp','w','W','ц','Ц'].includes(e.key)){e.preventDefault();move('up');}
  else if(['ArrowDown','s','S','ы','Ы'].includes(e.key)){e.preventDefault();move('down');}
});

let sx,sy;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  const dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
  else move(dy>0?'down':'up');
},{passive:true});

init();
</script>
</body>
</html>
